<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f1f22">
  <title>Mosaic Crochet</title>
  <link id="favicon" rel="icon" type="image/png">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <header class="document-bar" id="document-bar">
      <div class="document-actions g-file">
        <button class="btn" id="btn-edit" aria-controls="inspector-host" aria-expanded="false" title="Pattern dimensions">Pattern</button>
        <button class="btn" id="btn-load"   title="Load .mcw file">Load</button>
        <button class="btn" id="btn-save"   title="Save as .mcw file">Save</button>
        <button class="btn" id="btn-export" title="Export pattern as text">Export</button>
        <button class="btn" id="btn-undo"   title="Undo (Ctrl+Z)">Undo</button>
        <button class="btn" id="btn-redo"   title="Redo (Ctrl+Y / Ctrl+Shift+Z)">Redo</button>
        <button class="btn" id="btn-more" title="More commands" aria-haspopup="menu" aria-expanded="false" hidden>More</button>
      </div>
      <div class="document-actions g-hlrot">
        <button class="btn btn--icon" id="rotate-ccw" title="Rotate counter-clockwise (Shift+R)" aria-label="Rotate counter-clockwise">↺</button>
        <button class="btn btn--icon" id="rotate-cw"  title="Rotate clockwise (R)"               aria-label="Rotate clockwise">↻</button>
        <button class="btn btn--icon" id="btn-hl-toggle" title="Settings" aria-label="Settings" aria-controls="inspector-host" aria-expanded="false">⚙</button>
      </div>
  </header>

  <div id="more-popover" popover role="menu" aria-label="More commands">
    <div id="more-actions"></div>
  </div>

  <div class="workspace">
    <nav class="authoring-dock" id="authoring-dock" aria-label="Authoring tools">
      <div class="dock-group g-paint" role="group" aria-label="Paint tools">
        <button class="btn btn--icon" id="tool-pencil" title="Pencil (P)" aria-label="Pencil">✏️</button>
        <button class="btn btn--icon" id="tool-fill"   title="Fill (F)"   aria-label="Fill">🪣</button>
        <button class="btn btn--icon" id="tool-eraser"  title="Eraser (E) — restore natural; right-click adds overlay" aria-label="Eraser">🧹</button>
        <button class="btn btn--icon" id="tool-overlay" title="Overlay (O) — paint ✕ stitches; right-click restores natural" aria-label="Overlay">✕</button>
        <button class="btn btn--icon" id="tool-invert"  title="Invert (I)" aria-label="Invert">⇋</button>
      </div>

      <div class="dock-group g-transform" role="group" aria-label="Transform">
        <button class="btn btn--icon" id="tool-select"  title="Select (S) — drag for rectangle; Shift adds, Ctrl removes" aria-label="Select">▭</button>
        <button class="btn btn--icon" id="tool-wand"    title="Magic wand (W) — click a cell to select its connected same-colour region; Shift adds, Ctrl removes" aria-label="Magic wand">✨</button>
        <button class="btn btn--icon" id="tool-move"    title="Move (M) — drag inside the selection; Ctrl duplicates; Alt moves the mask only" aria-label="Move">✥</button>
        <button class="btn" id="move-mask" title="Move the selection mask without moving its content" aria-label="Mask move" aria-pressed="false">Mask</button>
        <button class="btn btn--icon" id="btn-sym-toggle" data-transform-state="none" title="Symmetry and repeat: no transforms configured" aria-controls="inspector-host" aria-expanded="false" aria-label="Symmetry and repeat: no transforms configured">⊕</button>
      </div>

      <div class="dock-group g-colors" role="group" aria-label="Yarns">
        <div id="swatch-a" class="swatch swatch--active" tabindex="0" role="button" title="Select Yarn A (1) — double-click or long-press to edit" aria-label="Yarn A" aria-pressed="true">
          <span class="swatch-label" aria-hidden="true">A</span>
          <span class="swatch-check" aria-hidden="true">✓</span>
          <input type="color" id="color-a" value="#000000" tabindex="-1">
        </div>
        <div id="swatch-b" class="swatch" tabindex="0" role="button" title="Select Yarn B (2) — double-click or long-press to edit" aria-label="Yarn B" aria-pressed="false">
          <span class="swatch-label" aria-hidden="true">B</span>
          <span class="swatch-check" aria-hidden="true">✓</span>
          <input type="color" id="color-b" value="#ffffff" tabindex="-1">
        </div>
        <button class="btn" id="edit-yarn" type="button" aria-label="Edit Yarn A" title="Edit Yarn A colour">Edit</button>
        <button class="btn" id="swap-yarns" type="button" aria-label="Swap yarns" title="Swap Yarn A and Yarn B colours">Swap</button>
      </div>
    </nav>

    <main class="canvas-area">
      <canvas id="canvas"></canvas>
      <div id="status" class="status" aria-label="Canvas context">
        <span id="status-tool"></span>
        <span id="status-yarn"></span>
        <span id="status-coordinates" hidden></span>
        <span id="status-feedback" class="status-feedback" role="status" aria-live="polite" aria-atomic="true" hidden></span>
        <button id="status-selection" class="status-action" type="button" aria-controls="inspector-host" aria-expanded="false" hidden></button>
        <span id="status-overlays"></span>
        <span id="status-invalid" hidden></span>
        <span id="status-transforms" hidden></span>
      </div>
    </main>

    <aside id="inspector-host" class="inspector-host" aria-labelledby="inspector-title" hidden>
      <header class="inspector-header">
        <strong id="inspector-title">Inspector</strong>
        <button class="btn btn--icon btn--ghost" id="inspector-close" type="button" aria-label="Close inspector">×</button>
      </header>
      <div class="inspector-content">
  <section id="selection-popover" class="inspector-panel" role="dialog" aria-label="Selection" hidden>
    <div class="selection-card-header">
      <strong id="selection-card-title">Selection</strong>
      <span id="selection-card-clipboard"></span>
    </div>
    <div id="selection-modes" class="selection-modes" role="group" aria-label="Move outcome">
      <button class="btn" id="selection-mode-move" type="button" aria-pressed="true">Move content</button>
      <button class="btn" id="selection-mode-duplicate" type="button" aria-pressed="false">Duplicate content</button>
      <button class="btn" id="selection-mode-area" type="button" aria-pressed="false">Move selection area</button>
    </div>
    <div class="selection-actions">
      <button class="btn" id="selection-copy" type="button" aria-label="Copy">Copy <kbd>Ctrl+C</kbd></button>
      <button class="btn" id="selection-cut" type="button" aria-label="Cut">Cut <kbd>Ctrl+X</kbd></button>
      <button class="btn" id="selection-paste" type="button" aria-label="Paste">Paste <kbd>Ctrl+V</kbd></button>
      <button class="btn" id="selection-deselect" type="button" aria-label="Deselect">Deselect <kbd>Esc</kbd></button>
    </div>
    <div id="selection-deselect-help" class="popover-help">Deselect places the content and removes the selection.</div>
    <div id="selection-paste-help" class="popover-help">Nothing copied yet.</div>
  </section>

  <!-- ── Settings inspector ───────────────────────────────────────────── -->
  <section id="hl-popover" class="inspector-panel" aria-label="Settings" hidden>
    <div class="popover-row" title="Fades the ✕ overlay marks and ! invalid marks. 0 hides them entirely.">
      <span class="popover-label">Highlight opacity</span>
      <input type="range" id="hl-opacity" value="100" min="0" max="100" aria-label="Highlight opacity">
    </div>
    <div class="popover-row" title="How vivid the ! invalid markers are. Hue is picked automatically to contrast with your colours; this slider only adjusts intensity.">
      <span class="popover-label">Invalid marker intensity</span>
      <input type="range" id="invalid-intensity" value="65" min="0" max="100" aria-label="Invalid marker intensity">
    </div>
    <label class="toggle popover-row" title="Worked-row numbers in the left gutter with the foundation unnumbered; round numbers above (half/quarter) or in corner cells (full).">
      <span class="popover-label">Show numbers</span>
      <input type="checkbox" id="labels-on" checked>
      <span class="toggle-track"></span>
    </label>
    <label class="toggle popover-row" title="Block paint on cells that can never host a valid overlay (top row in row mode; outermost ring and diagonal corners in round mode). Fixing an already-wrong cell still works.">
      <span class="popover-label">Lock cells with no valid overlay</span>
      <input type="checkbox" id="lock-invalid">
      <span class="toggle-track"></span>
    </label>
  </section>

  <!-- ── Mirror & Repeat inspector ───────────────────────────────────── -->
  <section id="sym-popover" class="inspector-panel" aria-label="Mirror and repeat" hidden>
    <div class="popover-row">
      <span class="popover-label">Add axis</span>
      <div class="sym-add-row">
        <button class="btn btn--icon" id="add-sym-v"  title="Add vertical mirror (V)"     aria-label="Add vertical">↔</button>
        <button class="btn btn--icon" id="add-sym-h"  title="Add horizontal mirror (H)"   aria-label="Add horizontal">↕</button>
        <button class="btn btn--icon" id="add-sym-c"  title="Add central rotation (C)"    aria-label="Add central">⊕</button>
        <button class="btn btn--icon" id="add-sym-d1" title="Add diagonal ╲ (D)"          aria-label="Add diagonal">╲</button>
        <button class="btn btn--icon" id="add-sym-d2" title="Add anti-diagonal ╱ (A)"     aria-label="Add anti-diagonal">╱</button>
      </div>
    </div>
    <div id="sym-list" class="sym-list" aria-label="Axes"></div>
    <div class="repeat-grid">
      <label class="toggle popover-row" title="Include bounded tile offsets in the configured transformation.">
        <span class="popover-label">Include repeat</span>
        <input type="checkbox" id="repeat-enabled">
        <span class="toggle-track"></span>
      </label>
      <div class="field-row">
        <label for="repeat-tile-width">Tile width</label>
        <input type="number" id="repeat-tile-width" value="1" min="1" max="1048576">
      </div>
      <div class="field-row">
        <label for="repeat-tile-height">Tile height</label>
        <input type="number" id="repeat-tile-height" value="1" min="1" max="1048576">
      </div>
      <div class="field-row">
        <label for="repeat-copies-x">Horizontal copies / side</label>
        <input type="number" id="repeat-copies-x" value="1" min="0">
      </div>
      <div class="field-row">
        <label for="repeat-copies-y">Vertical copies / side</label>
        <input type="number" id="repeat-copies-y" value="1" min="0">
      </div>
      <div id="repeat-error" class="warning" role="alert" hidden></div>
    </div>
    <div class="transform-usage">
      <label class="toggle popover-row" title="Apply the configured transformation to future paint operations.">
        <span class="popover-label">Apply while drawing</span>
        <input type="checkbox" id="live-transforms" checked>
        <span class="toggle-track"></span>
      </label>
      <div class="popover-row">
        <button class="btn" id="replicate-selection" title="Stamp transformed copies from the current selection (T)" disabled>Stamp transformed copies</button>
      </div>
      <div id="replicate-selection-hint" class="popover-help" aria-live="polite">Select cells and configure a transformation.</div>
      <div id="transform-error" class="warning" role="alert" hidden></div>
    </div>
  </section>

  <!-- ── Pattern inspector ────────────────────────────────────────────── -->
  <section id="edit-pattern-widget" class="inspector-panel" aria-label="Pattern" hidden>
    <div class="segmented">
      <label><input type="radio" name="edit-mode" value="row" checked> Row</label>
      <label><input type="radio" name="edit-mode" value="round"> Round</label>
    </div>

    <div id="edit-row-controls" class="field-group">
      <div class="field-row">
        <label for="edit-width">Width</label>
        <input type="number" id="edit-width" value="16" min="2" max="1048576">
      </div>
      <div class="field-row">
        <label for="edit-height">Height</label>
        <input type="number" id="edit-height" value="16" min="2" max="1048576">
      </div>
    </div>

    <div id="edit-round-controls" class="field-group" hidden>
      <div class="segmented">
        <label><input type="radio" name="edit-submode" value="full" checked> Full</label>
        <label><input type="radio" name="edit-submode" value="half"> Half</label>
        <label><input type="radio" name="edit-submode" value="quarter"> Quarter</label>
      </div>
      <div class="field-row">
        <label for="edit-inner-width">Inner W</label>
        <input type="number" id="edit-inner-width" value="3" min="0" max="1048576">
      </div>
      <div class="field-row">
        <label for="edit-inner-height">Inner H</label>
        <input type="number" id="edit-inner-height" value="3" min="0" max="1048576">
      </div>
      <div class="field-row">
        <label for="edit-rounds">Rounds</label>
        <input type="number" id="edit-rounds" value="5" min="1" max="1048576">
      </div>
    </div>

    <div id="edit-error" class="warning" role="alert" hidden></div>

    <label class="toggle" title="When on, the new dimensions get a fresh pattern with natural colours. Forced on for row/round mode switches.">
      <input type="checkbox" id="edit-wipe">
      <span class="toggle-track"></span>
      Wipe
    </label>
    <div class="pattern-actions">
      <button class="btn" id="edit-cancel" type="button">Cancel</button>
      <button class="btn" id="edit-apply" type="button">Apply</button>
    </div>
  </section>
      </div>
    </aside>
  </div>

  <!-- ── Export dialog ──────────────────────────────────────────────── -->
  <dialog id="export-dialog" aria-labelledby="export-title">
    <div class="dlg-header">
      <span class="dlg-title" id="export-title">Export pattern</span>
      <span id="export-progress" class="dlg-progress" hidden></span>
      <button class="dlg-close" id="export-close" aria-label="Close" type="button">✕</button>
    </div>
    <div class="dlg-body">
      <label class="toggle">
        <input type="checkbox" id="alternate">
        <span class="toggle-track"></span>
        Alternate direction
      </label>
      <div id="export-warning" class="warning" hidden>
        ⚠ Pattern has invalid placements (! marks). Export may be incorrect.
      </div>
      <textarea id="export-text" rows="20" readonly spellcheck="false"></textarea>
    </div>
    <div class="dlg-footer">
      <button class="btn" id="export-copy" type="button">Copy</button>
      <button class="btn" id="export-download" type="button">Download .txt</button>
    </div>
  </dialog>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
