[package]
name    = "mosaic-crochet-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mosaic-crochet-core      = { path = "../core" }
wasm-bindgen             = { workspace = true }
glam                     = { workspace = true }
ndarray                  = { workspace = true }

[package.metadata.wasm-pack.profile.release]
# `--enable-nontrapping-float-to-int` lets `wasm-opt` keep `i32.trunc_sat_f64_s`
# instructions (emitted by `f64 as i32` casts in the symmetric-orbit walker).
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

