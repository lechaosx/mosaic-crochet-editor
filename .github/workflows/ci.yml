name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-tooling:
    name: Tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run test:tooling

  test-rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace
      - run: cargo test

  build-wasm:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm run build:wasm
      - uses: actions/upload-artifact@v7
        with:
          name: pkg
          path: wasm/pkg/

  test-logic:
    name: Logic tests
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: pkg
          path: wasm/pkg/
      - run: npm run typecheck --workspace logic
      - run: npm run test --workspace logic

  test-io:
    name: IO layer tests
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: pkg
          path: wasm/pkg/
      - run: npm run test --workspace web

  build-app:
    name: App build
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: pkg
          path: wasm/pkg/
      - run: npm run build:web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/

  test-e2e:
    name: E2E tests
    needs: build-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist/
      - run: npx playwright install chromium --with-deps
        working-directory: web
      - run: npm run test:e2e --workspace web

  deploy:
    name: Deploy to GitHub Pages
    needs: [test-tooling, test-rust, test-logic, test-io, test-e2e]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist/
      - id: deployment
        uses: actions/deploy-pages@v5
